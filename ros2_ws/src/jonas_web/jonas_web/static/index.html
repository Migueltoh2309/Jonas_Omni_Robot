<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jonas</title>
<style>
  /* Paleta UTEC: blanco, celeste y negro */
  :root {
    --bg: #ffffff; --panel: #f5f9fc; --panel2: #e8f5fc; --line: #d6e6ef;
    --text: #0a0a0a; --muted: #5f6f7a; --black: #0a0a0a;
    --cel: #33b9ea; --cel-dark: #1690c4; --cel-soft: rgba(51,185,234,.14);
    --ok: #22b573; --bad: #e5332a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; gap: 8px;
         padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
                  max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }

  /* ---------- barra superior ---------- */
  .top { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--cel); }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .brand img { height: 30px; width: auto; display: block; }
  .brand .name { font-weight: 800; font-size: 17px; letter-spacing: .3px; padding-left: 8px; border-left: 2px solid var(--line); }
  .modes { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button { background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
  .modes button.on { background: var(--black); color: #fff; }
  .modes button:disabled { opacity: .45; }
  .modes small { font-weight: 400; font-size: 11px; }
  .emo-btn { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--cel);
             border-radius: 10px; padding: 6px 10px; min-width: 0; font-weight: 600; }
  .emo-btn .e { font-size: 19px; line-height: 1; }
  .emo-btn .c { color: var(--cel-dark); font-size: 12px; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.ok { background: var(--ok); }
  .stop { background: var(--bad); color: #fff; font-weight: 800; letter-spacing: .5px; padding: 8px 16px; border-radius: 10px;
          box-shadow: 0 2px 8px rgba(229,51,42,.35); }
  .stop:active { transform: scale(.96); }

  /* ---------- zona principal (horizontal): joystick | panel derecho ---------- */
  .main { display: grid; grid-template-columns: 33% 1fr; gap: 10px; min-height: 0; }
  .side { display: grid; grid-template-rows: minmax(90px, 1fr) auto auto auto; gap: 8px; min-height: 0; min-width: 0; }

  .pad { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
         display: grid; place-items: center; min-height: 0; min-width: 0; overflow: hidden; }
  #padMove { height: 100%; }
  .pad .label { position: absolute; top: 6px; left: 10px; color: var(--muted); font-size: 12px; font-weight: 600;
                text-transform: uppercase; letter-spacing: .6px; }
  .ring { position: relative; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
  .ring.h { border-radius: 999px; }
  .ring::before, .ring::after { content: ""; position: absolute; background: var(--line); }
  .ring::before { left: 50%; top: 12%; bottom: 12%; width: 1px; }
  .ring::after { top: 50%; left: 8%; right: 8%; height: 1px; }
  .ring.h::before { display: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 36%; aspect-ratio: 1; border-radius: 50%;
          transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 30%, #7fd6f5, var(--cel) 55%, var(--cel-dark));
          box-shadow: 0 4px 12px rgba(22,144,196,.35); transition: transform .12s ease-out; }
  .ring.h .knob { height: 80%; width: auto; }
  .pad.active .knob { transition: none; }
  .pad.active .ring { border-color: var(--cel); background: var(--cel-soft); }
  .hint { position: absolute; color: #9fb4c1; font-size: 18px; font-weight: 700; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
  .card h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .speed { display: flex; align-items: center; gap: 10px; }
  .speed h3 { margin: 0; }
  .speed input { flex: 1; min-width: 0; height: 30px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
  .speed input::-webkit-slider-runnable-track { height: 12px; border-radius: 6px;
      background: linear-gradient(to right, var(--cel) var(--p, 50%), #dbe6ec var(--p, 50%)); }
  .speed input::-moz-range-track { height: 12px; border-radius: 6px; background: #dbe6ec; }
  .speed input::-moz-range-progress { height: 12px; border-radius: 6px; background: var(--cel); }
  .speed input::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -7px; border-radius: 50%;
      background: #fff; border: 3px solid var(--cel-dark); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .speed input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff;
      border: 3px solid var(--cel-dark); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .speed b { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .actions button { min-width: 0; white-space: nowrap; background: #fff; border: 1px solid var(--line); border-radius: 10px;
                    padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
  .actions button .i { font-size: 20px; line-height: 1; }
  .actions button:active, .actions button.flash { background: var(--cel); border-color: var(--cel); color: #fff; }
  .tele { display: flex; gap: 18px; font-variant-numeric: tabular-nums; font-size: 16px; color: var(--muted);
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .tele b { color: var(--text); font-weight: 700; font-size: 18px; }

  /* ---------- modo automático ---------- */
  .autoview { display: none; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  .app.auto .main { display: none; }
  .app.auto .autoview { display: grid; }
  .lidar canvas { width: 100%; height: 100%; display: block; }
  .aside { display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; gap: 8px; min-height: 0; min-width: 0; }
  .cam { position: relative; background: #0a0a0a; border-radius: 14px; overflow: hidden; min-height: 0;
         display: grid; place-items: center; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .cam.on img { display: block; } .cam.on .nocam { display: none; }
  .nocam { color: #9aa7b0; font-size: 13px; }
  .info { display: flex; align-items: center; gap: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .info b { color: var(--text); font-size: 17px; }
  .badge { background: var(--black); color: #fff; font-weight: 700; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
  .badge.EXPLORANDO { background: var(--cel); } .badge.ESQUIVANDO { background: #f59e0b; }
  .badge.INTERACTUANDO { background: var(--ok); } .badge.BLOQUEADO, .badge.SIN.LIDAR { background: var(--bad); }
  .runrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .runrow button { padding: 12px; border-radius: 12px; font-weight: 800; font-size: 16px; }
  .go { background: var(--cel); color: #fff; } .pause { background: var(--black); color: #fff; }
  .runrow button:disabled { opacity: .35; }

  /* ---------- lista de emociones ---------- */
  .sheet { position: fixed; inset: 0; background: rgba(10,10,10,.35); display: none; align-items: flex-start;
           justify-content: center; padding-top: 50px; z-index: 10; }
  .sheet.open { display: flex; }
  .sheet .list { background: #fff; border: 1px solid var(--line); border-radius: 14px; width: min(320px, 92vw);
                 max-height: calc(100dvh - 66px); overflow: auto; padding: 6px; touch-action: pan-y;
                 box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .sheet .list button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; padding: 9px 10px;
                        border-radius: 10px; text-align: left; }
  .sheet .list button .e { font-size: 22px; width: 28px; text-align: center; }
  .sheet .list button.on { background: var(--panel2); outline: 1px solid var(--cel); font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--black); color: #fff;
           padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 13px; z-index: 20; }
  .toast.show { opacity: .92; }
  .offline { position: fixed; inset: 0; display: none; place-items: center; background: rgba(255,255,255,.85); z-index: 30;
             text-align: center; color: var(--muted); font-weight: 600; }
  .offline.show { display: grid; }

  /* ---------- celular vertical: info arriba, joysticks abajo ---------- */
  @media (orientation: portrait) {
    .top { flex-wrap: wrap; row-gap: 8px; }
    .brand { width: 100%; justify-content: center; }
    .brand img { height: 34px; }
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #padMove { display: none; }
    .side { grid-template-rows: auto auto auto 1fr; }
    .side > .pad#padTurn { display: none; }
    .sticks { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
    .sticks .pad { aspect-ratio: auto; height: auto; }
  }
  .sticks { display: none; }
  @media (orientation: portrait) {
    .autoview { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .lidar { order: 2; min-height: 0; }
    .aside { order: 1; grid-template-rows: auto auto auto auto; }
    .cam { height: 27dvh; }
  }
  @media (max-height: 360px) { .brand .name { display: none; } .actions button { padding: 5px 2px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><img src="/static/utec.png" alt="UTEC"><span class="name">JONAS</span></div>
    <div class="modes" role="tablist">
      <button id="mManual" class="on">Manual</button>
      <button id="mAuto">Auto</button>
    </div>
    <button class="emo-btn" id="emoBtn" aria-haspopup="listbox">
      <span class="e" id="emoIcon">😐</span><span id="emoName">neutral</span><span class="c">▾</span>
    </button>
    <div class="spacer"></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">conectando…</span></div>
    <button class="stop" id="stopBtn">STOP</button>
  </div>

  <div class="main" id="manualView">
    <!-- horizontal: joystick grande a la izquierda -->
    <div class="pad" id="padMove"><div class="label">mover</div><div class="ring" data-stick="move"><div class="knob"></div></div></div>

    <div class="side">
      <div class="pad" id="padTurn"><div class="label">girar</div>
        <span class="hint" style="left:8px">⟲</span><span class="hint" style="right:8px">⟳</span>
        <div class="ring h" data-stick="turn"><div class="knob"></div></div></div>
      <div class="card speed"><h3>Velocidad</h3><input type="range" id="speed" min="10" max="100" step="5" value="50"><b id="speedTxt"></b></div>
      <div class="card"><h3>Acciones de los brazos</h3><div class="actions" id="actions"></div></div>
      <div class="tele"><span>vx <b id="tvx">0.00</b></span><span>vy <b id="tvy">0.00</b></span><span>giro <b id="twz">0.00</b></span>
        <span id="status">👀 0</span></div>
      <!-- vertical: los dos joysticks abajo -->
      <div class="sticks">
        <div class="pad" id="padMoveP"><div class="label">mover</div><div class="ring" data-stick="move"><div class="knob"></div></div></div>
        <div class="pad" id="padTurnP"><div class="label">girar</div><div class="ring h" data-stick="turn"><div class="knob"></div></div></div>
      </div>
    </div>
  </div>

  <!-- ===================== MODO AUTOMÁTICO ===================== -->
  <div class="autoview" id="autoView">
    <div class="pad lidar"><div class="label">lidar</div><canvas id="lidar"></canvas></div>
    <div class="aside">
      <div class="cam"><img id="cam" alt=""><div class="nocam" id="nocam">sin imagen de la cámara</div></div>
      <div class="card info">
        <span class="badge" id="aState">EN PAUSA</span>
        <span>más cerca <b id="aNear">–</b></span>
        <span>👀 <b id="aFaces">0</b></span>
      </div>
      <div class="runrow">
        <button class="go" id="aRun">▶ INICIAR</button>
        <button class="pause" id="aPause">⏸ PAUSA</button>
      </div>
      <div class="card speed"><h3>Vel. máx</h3><input type="range" id="aSpeed" min="5" max="25" step="1" value="15"><b id="aSpeedTxt">0.15 m/s</b></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="list" id="emoList" role="listbox"></div></div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div>Sin conexión con Jonas<br><small>reintentando…</small></div></div>

<script>
const EMOJI = { neutral: "😐", feliz: "😊", triste: "😢", enojado: "😠", preocupado: "😟",
                mareado: "😵‍💫", aburrido: "😑", sorprendido: "😮" };
const ACTION_ICON = { saludar: "👋", reposo: "💤", aplaudir: "👏", abrazar: "🤗" };
const $ = (id) => document.getElementById(id);

let ws = null, maxLin = 0.3, maxAng = 1.5;
const move = { x: 0, y: 0, n: 0 }, turn = { x: 0, y: 0, n: 0 };   // n = dedos activos en ese control
let wasMoving = false;

// ---------- conexión ----------
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "hello") { maxLin = m.max_linear; maxAng = m.max_angular; buildEmotions(m.emotions); buildActions(m.actions); updSpeed(); }
    if (m.t === "hello" || m.t === "state") showState(m);
  };
}
function setConn(ok) {
  $("dot").classList.toggle("ok", ok);
  $("connTxt").textContent = ok ? "conectado" : "sin conexión";
  $("offline").classList.toggle("show", !ok);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function showState(m) {
  setMode(m.mode);
  if (m.mode === "auto") showAuto(m);
  $("emoIcon").textContent = EMOJI[m.emotion] || "🙂";
  $("emoName").textContent = m.emotion;
  document.querySelectorAll("#emoList button").forEach(b => b.classList.toggle("on", b.dataset.name === m.emotion));
  $("tvx").textContent = m.cmd[0].toFixed(2); $("tvy").textContent = m.cmd[1].toFixed(2); $("twz").textContent = m.cmd[2].toFixed(2);
  let s = `👀 ${m.faces}`;
  if (m.clients > 1) s += ` · 📱 ${m.clients}`;
  if (m.status) s += ` · ${m.status}`;
  $("status").textContent = s;
}

// ---------- emociones (lista desplegable) ----------
function buildEmotions(list) {
  const box = $("emoList"); box.innerHTML = "";
  list.forEach(name => {
    const b = document.createElement("button");
    b.dataset.name = name;
    b.innerHTML = `<span class="e">${EMOJI[name] || "🙂"}</span><span>${name}</span>`;
    b.onclick = () => { send({ t: "emotion", name }); closeSheet(); toast(`${EMOJI[name] || ""} ${name}`); };
    box.appendChild(b);
  });
}
$("emoBtn").onclick = () => $("sheet").classList.add("open");
$("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
function closeSheet() { $("sheet").classList.remove("open"); }

// ---------- acciones ----------
function buildActions(list) {
  const box = $("actions"); box.innerHTML = "";
  list.forEach(name => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="i">${ACTION_ICON[name] || "🤖"}</span><span>${name}</span>`;
    b.onclick = () => { send({ t: "action", name }); b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 250); toast(`acción: ${name}`); };
    box.appendChild(b);
  });
}

// ---------- velocidad ----------
function speed() { return $("speed").value / 100; }
function updSpeed() {
  const el = $("speed");
  el.style.setProperty("--p", ((el.value - el.min) / (el.max - el.min) * 100) + "%");   // parte celeste del riel
  $("speedTxt").textContent = `${(maxLin * speed()).toFixed(2)} m/s`;
}
$("speed").oninput = updSpeed;

// ---------- joysticks (multitáctil; hay una copia para horizontal y otra para vertical) ----------
function joystick(ring, state, horizontalOnly) {
  const pad = ring.parentElement, knob = ring.querySelector(".knob");
  let id = null;
  const update = (ev) => {
    const r = ring.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const rad = horizontalOnly ? r.width / 2 - knob.offsetWidth / 2 : r.width / 2;
    let dx = (ev.clientX - cx) / rad, dy = horizontalOnly ? 0 : (ev.clientY - cy) / rad;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = `translate(calc(-50% + ${dx * rad}px), calc(-50% + ${dy * rad}px))`;
    const dz = (v) => Math.abs(v) < 0.08 ? 0 : (v - Math.sign(v) * 0.08) / 0.92;   // zona muerta
    state.x = dz(dx); state.y = dz(dy);
  };
  pad.addEventListener("pointerdown", (ev) => {
    if (id !== null) return;
    id = ev.pointerId; pad.setPointerCapture(id); pad.classList.add("active"); state.n++; update(ev);
  });
  pad.addEventListener("pointermove", (ev) => { if (ev.pointerId === id) update(ev); });
  const end = (ev) => {
    if (ev.pointerId !== id) return;
    id = null; state.n = Math.max(0, state.n - 1); state.x = 0; state.y = 0; pad.classList.remove("active");
    knob.style.transform = "translate(-50%, -50%)";
  };
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end); pad.addEventListener("lostpointercapture", end);
}
document.querySelectorAll(".ring").forEach(r => joystick(r, r.dataset.stick === "move" ? move : turn, r.classList.contains("h")));

function sizeRings() {   // cada joystick ocupa lo que permita su panel
  document.querySelectorAll(".ring").forEach(ring => {
    const pad = ring.parentElement;
    const w = pad.clientWidth - 20, h = pad.clientHeight - 30;
    if (ring.classList.contains("h")) { const s = Math.min(w * 0.9, 520); ring.style.width = s + "px"; ring.style.height = Math.min(s * 0.36, h) + "px"; }
    else { const s = Math.max(60, Math.min(w, h)); ring.style.width = s + "px"; ring.style.height = s + "px"; }
  });
}
addEventListener("resize", sizeRings); new ResizeObserver(sizeRings).observe(document.body); sizeRings();

// 20 Hz mientras se usa algún joystick; al soltar, un "stop"
setInterval(() => {
  if (move.n || turn.n) {
    // pantalla: arriba = adelante (+x), izquierda = +y; girar a la izquierda = antihorario (+z)
    send({ t: "cmd", vx: -move.y, vy: -move.x, wz: -turn.x, speed: speed() });
    wasMoving = true;
  } else if (wasMoving) { send({ t: "stop" }); wasMoving = false; }
}, 50);

$("stopBtn").onclick = () => { send({ t: "stop" }); toast("⛔ STOP"); };
// pantalla bloqueada / app en segundo plano: en manual frena; en auto el robot sigue solo
document.addEventListener("visibilitychange", () => { if (document.hidden && mode === "manual") send({ t: "stop" }); });
// ---------- modos ----------
var mode = "manual";
function setMode(m) {
  if (m === mode) return;
  mode = m;
  document.querySelector(".app").classList.toggle("auto", m === "auto");
  $("mManual").classList.toggle("on", m === "manual"); $("mAuto").classList.toggle("on", m === "auto");
  if (m === "auto") requestAnimationFrame(drawLidar); else sizeRings();
}
$("mManual").onclick = () => send({ t: "mode", name: "manual" });
$("mAuto").onclick = () => send({ t: "mode", name: "auto" });

// ---------- modo automático ----------
let autoSt = null;
function showAuto(m) {
  autoSt = m.auto;
  const a = m.auto || {};
  const st = a.state || "SIN DATOS";
  $("aState").textContent = st; $("aState").className = "badge " + st;
  $("aNear").textContent = a.nearest == null ? "–" : `${a.nearest.toFixed(2)} m`;
  $("aFaces").textContent = m.faces;
  $("aRun").disabled = !!a.running; $("aPause").disabled = !a.running;
  if (a.max_speed && document.activeElement !== $("aSpeed")) {
    $("aSpeed").value = Math.round(a.max_speed * 100); $("aSpeedTxt").textContent = `${a.max_speed.toFixed(2)} m/s`;
  }
  drawLidar();
}
$("aRun").onclick = () => { send({ t: "auto", run: true }); toast("▶ modo automático en marcha"); };
$("aPause").onclick = () => { send({ t: "auto", run: false }); toast("⏸ en pausa"); };
$("aSpeed").oninput = () => { $("aSpeedTxt").textContent = `${($("aSpeed").value / 100).toFixed(2)} m/s`; };
$("aSpeed").onchange = () => send({ t: "auto", max_speed: $("aSpeed").value / 100 });

// cámara: una foto por segundo (solo en modo auto y con la pestaña visible)
setInterval(() => {
  if (mode !== "auto" || document.hidden) return;
  const img = new Image();
  img.onload = () => { $("cam").src = img.src; $("cam").parentElement.classList.add("on"); };
  img.onerror = () => $("cam").parentElement.classList.remove("on");
  img.src = "/snapshot.jpg?t=" + Date.now();
}, 1000);

// lidar: el robot al centro, arriba = adelante
function drawLidar() {
  const cv = $("lidar"); if (!cv || mode !== "auto") return;
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 8, R = Math.min(W, H - 20) / 2 - 6, maxM = 3.0, k = R / maxM;
  g.font = "11px system-ui"; g.textAlign = "left";
  for (let m = 1; m <= maxM; m++) {   // anillos cada 1 m
    g.beginPath(); g.arc(cx, cy, m * k, 0, 2 * Math.PI); g.strokeStyle = "#d6e6ef"; g.lineWidth = 1; g.stroke();
    g.fillStyle = "#8aa0ad"; g.fillText(`${m} m`, cx + 3, cy - m * k + 12);
  }
  const a = autoSt || {};
  const rr = (a.robot_radius || 0.25) * k;
  // zona de parada
  g.beginPath(); g.arc(cx, cy, rr + (a.stop_dist || 0.25) * k, 0, 2 * Math.PI); g.fillStyle = "rgba(229,51,42,.07)"; g.fill();
  // puntos del lidar
  const scan = a.scan || [];
  const n = scan.length;
  for (let i = 0; i < n; i++) {
    const d = scan[i]; if (d == null) continue;
    const th = -Math.PI + (i + 0.5) * 2 * Math.PI / n;   // marco del robot: 0 = adelante, + = izquierda
    const dd = Math.min(d, maxM);
    const x = cx - Math.sin(th) * dd * k, y = cy - Math.cos(th) * dd * k;
    const close = d - (a.robot_radius || 0.25) < (a.stop_dist || 0.25) * 2;
    g.beginPath(); g.arc(x, y, d > maxM ? 2 : 3.5, 0, 2 * Math.PI);
    g.fillStyle = close ? "#e5332a" : (d > maxM ? "#c3d2db" : "#0a0a0a"); g.fill();
  }
  // rumbo elegido
  if (a.running && a.state !== "INTERACTUANDO") {
    const h = a.heading || 0, L = Math.min(Math.max(a.free || 0.5, 0.4), maxM) * k;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx - Math.sin(h) * L, cy - Math.cos(h) * L);
    g.strokeStyle = "#33b9ea"; g.lineWidth = 4; g.lineCap = "round"; g.stroke();
  }
  // robot
  g.beginPath(); g.arc(cx, cy, rr, 0, 2 * Math.PI); g.fillStyle = "#33b9ea"; g.fill();
  g.beginPath(); g.moveTo(cx, cy - rr - 7); g.lineTo(cx - 7, cy - rr + 4); g.lineTo(cx + 7, cy - rr + 4); g.closePath();
  g.fillStyle = "#0a0a0a"; g.fill();
  if (!n) { g.fillStyle = "#8aa0ad"; g.textAlign = "center"; g.fillText("sin datos del lidar", cx, cy + rr + 22); }
}
addEventListener("resize", drawLidar);

let toastT = null;
function toast(txt) { const t = $("toast"); t.textContent = txt; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1200); }

// valores por defecto (la app se ve completa aunque todavía no haya conexión)
buildEmotions(Object.keys(EMOJI)); buildActions(Object.keys(ACTION_ICON)); updSpeed();
connect();
</script>
