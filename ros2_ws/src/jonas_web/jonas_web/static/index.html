<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06080e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jonas</title>
<style>
  :root {
    --bg: #06080e; --panel: #0e1422; --panel2: #151d30; --line: #22304d;
    --text: #dbe7ff; --muted: #7d8db0; --accent: #2e96ff; --accent2: #5ab8ff;
    --ok: #3ddc84; --warn: #ffb020; --bad: #ff4d3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  .app { height: 100dvh; display: grid; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
         max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); gap: 8px;
         grid-template-rows: auto 1fr; }

  /* barra superior */
  .top { display: flex; align-items: center; gap: 8px; }
  .modes { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .modes button { background: none; padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 600; }
  .modes button.on { background: var(--accent); color: #fff; }
  .modes button:disabled { opacity: .45; }
  .modes small { font-weight: 400; font-size: 11px; }
  .emo-btn { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
             border-radius: 12px; padding: 7px 12px; min-width: 0; }
  .emo-btn .e { font-size: 20px; line-height: 1; }
  .emo-btn .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .emo-btn .c { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .stop { background: var(--bad); color: #fff; font-weight: 800; letter-spacing: .5px; padding: 9px 16px;
          border-radius: 12px; box-shadow: 0 0 14px rgba(255,77,61,.45); }
  .stop:active { transform: scale(.96); }

  /* zona principal: joystick | centro | giro */
  .main { display: grid; grid-template-columns: 1fr minmax(180px, 1.1fr) 1fr; gap: 10px; min-height: 0; }
  .pad { position: relative; background: radial-gradient(circle at 50% 50%, var(--panel2), var(--panel) 70%);
         border: 1px solid var(--line); border-radius: 18px; display: grid; place-items: center; min-height: 0;
         overflow: hidden; }
  .pad .label { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 12px; }
  .ring { position: relative; border-radius: 50%; border: 2px solid var(--line);
          background: radial-gradient(circle, rgba(46,150,255,.10), transparent 70%); }
  .ring.h { border-radius: 999px; }
  .ring::before, .ring::after { content: ""; position: absolute; background: var(--line); }
  .ring::before { left: 50%; top: 10%; bottom: 10%; width: 1px; }
  .ring::after { top: 50%; left: 10%; right: 10%; height: 1px; }
  .ring.h::before { display: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; border-radius: 50%;
          transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 35%, var(--accent2), var(--accent) 60%, #155fb0);
          box-shadow: 0 0 18px rgba(46,150,255,.55); transition: transform .12s ease-out; }
  .ring.h .knob { height: 76%; width: auto; }
  .pad.active .knob { transition: none; }
  .pad.active .ring { border-color: var(--accent); }
  .arrows { position: absolute; inset: 0; pointer-events: none; color: var(--muted); font-size: 18px; }
  .arrows span { position: absolute; }

  .center { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .card h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .speed { display: flex; align-items: center; gap: 10px; }
  .speed input { flex: 1; accent-color: var(--accent); height: 28px; }
  .speed b { min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; overflow: auto; }
  .actions button { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px;
                    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .actions button:active, .actions button.flash { background: var(--accent); border-color: var(--accent); }
  .tele { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; font-variant-numeric: tabular-nums; font-size: 13px; }
  .tele div { color: var(--muted); } .tele b { color: var(--text); font-weight: 600; }
  .status { color: var(--muted); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* lista de emociones */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start;
           justify-content: center; padding-top: 52px; z-index: 10; }
  .sheet.open { display: flex; }
  .sheet .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(320px, 92vw);
                 max-height: calc(100dvh - 70px); overflow: auto; padding: 6px; touch-action: pan-y; }
  .sheet .list button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; padding: 10px;
                        border-radius: 10px; text-align: left; }
  .sheet .list button .e { font-size: 22px; width: 28px; text-align: center; }
  .sheet .list button.on { background: var(--panel2); outline: 1px solid var(--accent); }

  .toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel2);
           border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s;
           pointer-events: none; font-size: 13px; z-index: 20; }
  .toast.show { opacity: 1; }
  .offline { position: fixed; inset: 0; display: none; place-items: center; background: rgba(6,8,14,.8); z-index: 30;
             text-align: center; color: var(--muted); }
  .offline.show { display: grid; }

  /* celular vertical: joysticks abajo, uno al lado del otro */
  @media (orientation: portrait) {
    .top { flex-wrap: wrap; }
    .conn { order: 5; }
    .main { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; }
    .center { grid-column: 1 / -1; grid-row: 1; }
    .center .card { flex: none !important; }
    #padMove, #padTurn { grid-row: 2; }
  }
  @media (max-height: 380px) { .card { padding: 6px 8px; } .actions button { padding: 7px 4px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="modes" role="tablist">
      <button id="mManual" class="on">Manual</button>
      <button id="mAuto" disabled>Auto <small>(pronto)</small></button>
    </div>
    <button class="emo-btn" id="emoBtn" aria-haspopup="listbox">
      <span class="e" id="emoIcon">😐</span><span class="n" id="emoName">neutral</span><span class="c">▾</span>
    </button>
    <div class="spacer"></div>
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">conectando…</span></div>
    <button class="stop" id="stopBtn">STOP</button>
  </div>

  <div class="main">
    <div class="pad" id="padMove">
      <div class="label">mover</div>
      <div class="ring" id="ringMove"><div class="knob" id="knobMove"></div></div>
    </div>

    <div class="center">
      <div class="card">
        <h3>Velocidad</h3>
        <div class="speed"><input type="range" id="speed" min="10" max="100" step="5" value="50"><b id="speedTxt"></b></div>
      </div>
      <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <h3>Acciones de los brazos</h3>
        <div class="actions" id="actions"></div>
      </div>
      <div class="card">
        <div class="tele">
          <div>vx <b id="tvx">0.00</b></div><div>vy <b id="tvy">0.00</b></div><div>giro <b id="twz">0.00</b></div>
        </div>
        <div class="status" id="status">👀 caras: 0</div>
      </div>
    </div>

    <div class="pad" id="padTurn">
      <div class="label">girar</div>
      <div class="ring h" id="ringTurn"><div class="knob" id="knobTurn"></div></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="list" id="emoList" role="listbox"></div></div>
<div class="toast" id="toast"></div>
<div class="offline" id="offline"><div>Sin conexión con Jonas<br><small>reintentando…</small></div></div>

<script>
const EMOJI = { neutral: "😐", feliz: "😊", triste: "😢", enojado: "😠", preocupado: "😟",
                mareado: "😵‍💫", aburrido: "😑", sorprendido: "😮" };
const ACTION_ICON = { saludar: "👋", reposo: "💤", aplaudir: "👏", abrazar: "🤗" };
const $ = (id) => document.getElementById(id);

let ws = null, connected = false, maxLin = 0.3, maxAng = 1.5;
let move = { x: 0, y: 0, active: false }, turn = { x: 0, active: false };
let wasMoving = false;

// ---------- conexión ----------
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "hello") { maxLin = m.max_linear; maxAng = m.max_angular; buildEmotions(m.emotions); buildActions(m.actions); updSpeed(); }
    if (m.t === "hello" || m.t === "state") showState(m);
  };
}
function setConn(ok) {
  connected = ok;
  $("dot").classList.toggle("ok", ok);
  $("connTxt").textContent = ok ? "conectado" : "sin conexión";
  $("offline").classList.toggle("show", !ok);
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ---------- estado ----------
function showState(m) {
  $("emoIcon").textContent = EMOJI[m.emotion] || "🙂";
  $("emoName").textContent = m.emotion;
  document.querySelectorAll("#emoList button").forEach(b => b.classList.toggle("on", b.dataset.name === m.emotion));
  $("tvx").textContent = m.cmd[0].toFixed(2); $("tvy").textContent = m.cmd[1].toFixed(2); $("twz").textContent = m.cmd[2].toFixed(2);
  let s = `👀 caras: ${m.faces}`;
  if (m.clients > 1) s += ` · 📱 ${m.clients} conectados`;
  if (m.status) s += ` · ${m.status}`;
  $("status").textContent = s;
}

// ---------- emociones (lista desplegable) ----------
function buildEmotions(list) {
  const box = $("emoList"); box.innerHTML = "";
  list.forEach(name => {
    const b = document.createElement("button");
    b.dataset.name = name;
    b.innerHTML = `<span class="e">${EMOJI[name] || "🙂"}</span><span>${name}</span>`;
    b.onclick = () => { send({ t: "emotion", name }); closeSheet(); toast(`${EMOJI[name] || ""} ${name}`); };
    box.appendChild(b);
  });
}
$("emoBtn").onclick = () => $("sheet").classList.add("open");
$("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
function closeSheet() { $("sheet").classList.remove("open"); }

// ---------- acciones ----------
function buildActions(list) {
  const box = $("actions"); box.innerHTML = "";
  list.forEach(name => {
    const b = document.createElement("button");
    b.innerHTML = `<span>${ACTION_ICON[name] || "🤖"}</span><span>${name}</span>`;
    b.onclick = () => { send({ t: "action", name }); b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 250); toast(`acción: ${name}`); };
    box.appendChild(b);
  });
}

// ---------- velocidad ----------
function speed() { return $("speed").value / 100; }
function updSpeed() { $("speedTxt").textContent = `${(maxLin * speed()).toFixed(2)} m/s`; }
$("speed").oninput = updSpeed;

// ---------- joysticks (multitáctil: uno con cada pulgar) ----------
function joystick(pad, ring, knob, horizontalOnly, state) {
  let id = null;
  const update = (ev) => {
    const r = ring.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const rad = horizontalOnly ? r.width / 2 - knob.offsetWidth / 2 : r.width / 2;
    let dx = (ev.clientX - cx) / rad, dy = horizontalOnly ? 0 : (ev.clientY - cy) / rad;
    const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = `translate(calc(-50% + ${dx * rad}px), calc(-50% + ${dy * rad}px))`;
    const dz = (v) => Math.abs(v) < 0.08 ? 0 : (v - Math.sign(v) * 0.08) / 0.92;   // zona muerta
    state.x = dz(dx); state.y = dz(dy);
  };
  pad.addEventListener("pointerdown", (ev) => {
    if (id !== null) return;
    id = ev.pointerId; pad.setPointerCapture(id); pad.classList.add("active"); state.active = true; update(ev);
  });
  pad.addEventListener("pointermove", (ev) => { if (ev.pointerId === id) update(ev); });
  const end = (ev) => {
    if (ev.pointerId !== id) return;
    id = null; state.active = false; state.x = 0; state.y = 0; pad.classList.remove("active");
    knob.style.transform = "translate(-50%, -50%)";
  };
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end); pad.addEventListener("lostpointercapture", end);
}
joystick($("padMove"), $("ringMove"), $("knobMove"), false, move);
joystick($("padTurn"), $("ringTurn"), $("knobTurn"), true, turn);

function sizeRings() {   // el círculo del joystick ocupa lo que permita su panel
  for (const [pad, ring, h] of [[$("padMove"), $("ringMove"), false], [$("padTurn"), $("ringTurn"), true]]) {
    const s = Math.min(pad.clientWidth, pad.clientHeight - 24) * 0.86;
    ring.style.width = s + "px"; ring.style.height = (h ? s * 0.34 : s) + "px";
  }
}
addEventListener("resize", sizeRings); sizeRings();

// 20 Hz mientras se usa algún joystick; al soltar, un "stop"
setInterval(() => {
  const active = move.active || turn.active;
  if (active) {
    // pantalla: arriba = adelante (+x), izquierda = +y; girar a la izquierda = antihorario (+z)
    send({ t: "cmd", vx: -move.y, vy: -move.x, wz: -turn.x, speed: speed() });
    wasMoving = true;
  } else if (wasMoving) { send({ t: "stop" }); wasMoving = false; }
}, 50);

$("stopBtn").onclick = () => { send({ t: "stop" }); toast("⛔ STOP"); };
document.addEventListener("visibilitychange", () => { if (document.hidden) send({ t: "stop" }); });
$("mAuto").onclick = () => toast("El modo automático llegará pronto");

let toastT = null;
function toast(txt) { const t = $("toast"); t.textContent = txt; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1200); }

// valores por defecto (la app se ve completa aunque todavía no haya conexión)
buildEmotions(Object.keys(EMOJI)); buildActions(Object.keys(ACTION_ICON)); updSpeed();
connect();
</script>
</body>
</html>
